name: frontend-tsc

on:
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-tsc.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-tsc.yml"]

jobs:
  tsc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
