[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Real-time public sentiment agent backend"
authors = ["Public Service AI"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.5"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
langchain = "^0.2.12"
langgraph = "^0.2.0"
langsmith = "^0.1.27"
langchain-google-genai = "^1.0.7"
langchain-groq = "^0.1.0"
groq = "^0.4.0"
qdrant-client = "^1.12.1"
python-dotenv = "^1.0.1"
httpx = "^0.27.2"
pydantic = "^2.9.2"
apscheduler = "^3.10.4"
supabase = "^2.4.0"
pydantic-settings = "^2.6.1"
google-generativeai = "^0.7.2"
tavily-python = "^0.5.0"
torch = {version = "^2.0", source = "pytorch-cpu"}
sentence-transformers = "^5.1.2"
transformers = "^4.40.0"
praw = "^7.8.1"
langchain-core = "^0.2.0"
psutil = "^5.9.0"  # Memory monitoring for Railway debugging

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
ruff = "^0.6.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
