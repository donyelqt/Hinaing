[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Real-time public sentiment agent backend"
authors = ["Public Service AI"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.5"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
langchain = "^0.3.9"
langgraph = "^0.1.15"
langsmith = "^0.1.113"
qdrant-client = "^1.12.1"
python-dotenv = "^1.0.1"
httpx = "^0.27.2"
pydantic = "^2.9.2"
apscheduler = "^3.10.4"
supabase = "^2.4.0"
pydantic-settings = "^2.6.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
ruff = "^0.6.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
