[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
healthcheckStartPeriod = 120
startCommand = "sh -c 'uvicorn app.main:create_app --factory --host 0.0.0.0 --port ${PORT:-8000} --limit-concurrency 2 --timeout-keep-alive 30'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[build]
# Ensure enough memory during build for model downloads
buildCommand = "echo 'Build complete'"
